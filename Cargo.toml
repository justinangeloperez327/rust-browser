[workspace]
resolver = "2"
members = [
  "apps/rust-browser",
  "crates/browser-core",
  "crates/browser-engine",
  "crates/browser-windows",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
