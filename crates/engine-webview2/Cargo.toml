[package]
name = "engine-webview2"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
windows-webview = { git = "https://github.com/microsoft/windows-rs", package = "windows-webview", features = ["system"] }
windows-window = { git = "https://github.com/microsoft/windows-rs", package = "windows-window" }
windows-sys = { version = "0.61", features = ["Win32_System_Com"] }

[dependencies]
tracing = "0.1"
browser-engine = { path = "../browser-engine" }
browser-core = { path = "../browser-core" }
browser-windows = { path = "../browser-windows" }
browser-navigation = { path = "../browser-navigation" }

[lints]
workspace = true
